# ==============================================================================
# Chrony NTP monitoring configuration for Zabbix Agent 2
# Path: /etc/zabbix/zabbix_agent2.d/chrony.conf
#
# High-performance, zero-external-scripts architecture:
# Returns raw CSV data parsed natively by Zabbix Server / Proxy Preprocessing.
# ==============================================================================

# Global NTP tracking metrics (offset, stratum, leap status, root delay/dispersion)
UserParameter=chrony.tracking,chronyc -c tracking

# Upstream NTP sources metrics for Low-Level Discovery (LLD)
UserParameter=chrony.sources,chronyc -c sources
